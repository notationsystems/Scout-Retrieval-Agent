[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-pool"
version = "0.1.0"
description = "An append-only evidence pool where every value carries its provenance, and the admission gate refuses what it cannot ground."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Notation Systems Inc." }]
keywords = [
    "provenance", "evidence", "reproducibility", "active-learning",
    "experiment-design", "scientific-computing", "data-lineage",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

# DELIBERATELY EMPTY, and this is a feature rather than an omission.
# The whole library is standard library only, so it installs anywhere a
# supported Python runs and can never break because a transitive pin
# moved. Adding a dependency here is a decision to give that up.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Source = "https://github.com/notationsystems/provenance-pool"

[tool.setuptools]
packages = ["evidence", "scout", "retrieval", "materials", "experiment", "operations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
